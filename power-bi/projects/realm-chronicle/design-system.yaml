# Design system — Realm Chronicle (12×12 grid, standard 1280×720 canvas, left nav rail)
# Started from ../../02-build/report/layout/design-system-default.yaml. Rules: ../../02-build/report/layout/design-system.md

meta:
  page: { width: 1280, height: 720 }          # standard canvas (moved from 1920×1080 on 2026-09-13)
  theme: existing theme preserved              # appearance on the intro page comes from HTML-in-SVG, not a theme change
  units: grid-cells
  chrome: { left: 80 }                          # the nav rail on EVERY page - the grid lays out to its right.
                                                #   80, not 72: it leaves 1152px of content, so a half-width
                                                #   pair is exactly 568 + 16 + 568 with every edge on the 8px snap

grid:
  columns: 12
  rows: 12
  gutter: 16
  margin: 24
  snap: 8
  # Cell size is DERIVED from the values above, never stored here.
  # The formula and worked numbers live in ../../02-build/report/layout/layout-guidelines.md#grid-12x12.

bands:
  summary:  { rows: [1, 4]  }
  analysis: { rows: [4, 10] }
  detail:   { rows: [10, 13] }

defaults:
  title:      { span: [12, 1], band: summary }
  slicer:     { span: [2, 1],  band: summary }
  card:       { span: [3, 3],  band: summary }
  chart:      { span: [6, 5],  band: analysis }
  chart_wide: { span: [12, 5], band: analysis }
  table:      { span: [12, 3], band: detail }
  rail:       { span: [2, 12], band: summary }

layouts:
  kpi_row_4:      [ [1,1,4,4], [4,1,7,4], [7,1,10,4], [10,1,13,4] ]
  charts_2up:     [ [1,4,7,10], [7,4,13,10] ]
  charts_3up:     [ [1,4,5,10], [5,4,9,10], [9,4,13,10] ]
  hero_plus_rail: [ [1,1,3,13], [3,1,13,9], [3,9,13,13] ]

  # Intro page: a cover, read top to bottom — who we are, what happened, who stood out.
  #   [0] hero     — title + the saga in one sentence          rows 1-4   full width
  #   [1] ledgers  — the four ledgers at a glance               rows 5-7   full width
  #   [2] legends  — Hall of Legends, top slayers               rows 8-12  left half
  #   [3] bosses   — the boss roll, the four raid targets       rows 8-12  right half
  intro:          [ [1,1,13,5], [1,5,13,8], [1,8,7,13], [7,8,13,13] ]

  # Bestiary: a field guide - the header, every creature as a card grouped Boss > Elite > Field,
  # and the families it adds up to.
  #   [0] header   — THE BESTIARY + kills by kind              rows 1-2   full width
  #   [1] creatures— the 32 creature cards                      rows 3-12  cols 1-9
  #   [2] families — kills + deadliness by family, deadliest    rows 3-12  cols 10-12
  bestiary:       [ [1,1,13,3], [1,3,10,13], [10,3,13,13] ]

  # Quest Board: header · the quest chains, step by step · bounty by danger · bounty by rank
  quests:         [ [1,1,13,3], [1,3,9,13], [9,3,13,8], [9,8,13,13] ]

  # The Exchange: header · market board (top items) · gold by category · loot by rarity
  exchange:       [ [1,1,13,3], [1,3,7,13], [7,3,13,8], [7,8,13,13] ]

  # Realm Map: header · the map, plotted from lat/long · the realm ledger
  realms:         [ [1,1,13,3], [1,3,9,13], [9,3,13,13] ]

# Navigation rail (design A "Gilded Rail", approved 2026-09-13) is report CHROME, not content: a fixed
# 80px strip at x=0 on EVERY page, declared above as meta.chrome.left so the resolver lays the grid
# out to its right (content starts at 80 + margin = 104). Rail geometry lives in build/chroniclekit.py
# (RAIL_W, ITEM_TOP, ITEM_STEP), every edge on the 8px snap; its visuals are recorded below.
overrides:
  - { visual: "navRail",     reason: "nav rail artwork - fixed 80x720 chrome, left of the content grid" }
  - { visual: "navIntro",    reason: "nav rail click target - sits on its rail item, not a grid region" }
  - { visual: "navBestiary", reason: "nav rail click target - sits on its rail item, not a grid region" }
  - { visual: "navQuests",   reason: "nav rail click target - sits on its rail item, not a grid region" }
  - { visual: "navExchange", reason: "nav rail click target - sits on its rail item, not a grid region" }
  - { visual: "navRealms",   reason: "nav rail click target - sits on its rail item, not a grid region" }
