# PBIP Hook Configuration
#
# Toggle individual validation checks on or off.
# All checks are enabled by default. Set to false to disable.
# Changes take effect immediately (no restart needed).

# Master kill-switch for all hooks in this plugin.
# Set to false if you see noisy "PostToolUse hook error" messages on Windows,
# or while troubleshooting unrelated issues. Leaves individual checks below
# intact; flip this back to true to re-enable everything.
all_hooks_enabled: true

# JSON syntax validation (jq empty)
json_syntax: true

# Folder name spaces check (pages/visuals won't render with spaces)
folder_spaces: true

# Required fields per file type (from Microsoft JSON schemas)
required_fields: true

# $schema URL format validation
schema_url: true

# Put back the "$schema" key Power BI Desktop strips from definition.pbir and
# definition.pbism every time it saves. Unlike every other check here this one
# REPAIRS rather than reports — the fix is a known constant inserted at a known
# position, so it cannot lose content, and the alternative is a project that
# fails `pbir validate` because someone pressed Ctrl+S.
# See 04-review/audit/pbip-schema-drift.md.
restore_schema: true

# Visual/page name format (word chars and hyphens only)
name_format: true

# byPath target directory existence check
bypath_exists: true

# fab exists check for byConnection models (requires fab CLI + auth)
fab_exists: true

# TMDL structural syntax validation (requires tmdl-validate binary)
tmdl_syntax: true

# TMDL Desktop-strict trap lint (catches what tmdl-validate misses):
#   - multi-line measure body indented ≤ formatString/displayFolder/lineageTag indent
#     ([[tmdl-multiline-measures]] — Desktop errors with "syntax for formatString is incorrect")
#   - standalone `//` comments inside measure bodies
#     ([[tmdl-comment-syntax]] — Desktop only accepts `///` docstrings)
# Pure-bash + awk, no external binary, no jq dependency at the awk stage.
lint_tmdl_traps: true

# Visual binding field check — before pbir add visual / pbir visuals bind,
# verify each -d "role:Table.Field" actually exists in the model.
# Catches hallucinated measure / column names. Requires pbir CLI.
binding_check: true
