facts:

  # ── The headline: who slew what. Guild rivalry + player leaderboards + field vs boss. ──
  MonsterKills:
    grain: [Date, Adventurer, Monster]
    sparsity: 0.93
    measures:
      MonstersSlain:
        total: 2400000
        min: 1
        max: 80
        noise: 0.40
        trend: { yoy: 0.12 }
        shares:
          # exact on Monster; `Monster: pareto` then ranks individuals *within* each Kind
          Kind:    { Field: 0.82, Elite: 0.15, Boss: 0.03 }
          Monster: pareto
          # exact on Adventurer; `Adventurer: pareto` ranks players within their guild
          Guild:
            Ironpact: 0.155
            Emberwatch: 0.140
            Wyrmbane: 0.125
            Thornguard: 0.110
            Nightwardens: 0.100
            Stormcallers: 0.090
            "Gilded Fang": 0.085
            "Silver Compass": 0.080
            Oathkeepers: 0.070
            "Hollow Crown": 0.045
          Adventurer: pareto
      GoldEarned:
        derived: "np.round(MonstersSlain * gold_per_kill)"
        gold_per_kill: { min: 6, max: 140 }
      DamageDealt:
        derived: "np.round(MonstersSlain * damage_per_kill)"
        damage_per_kill: { min: 90, max: 1200 }
      # Allocated, NOT derived from MonstersSlain: a per-row `floor(slain / n)` collapses to zero on
      # low-volume rows, so small guilds showed ~1 wipe per 18,000 kills against the leaders' 1 per 329.
      # Declaring it lets the engine rake it, and buys a better story: wipes concentrate on hard
      # content, and the reckless guilds wipe far above their kill share.
      PartyWipes:
        total: 9000
        min: 1
        max: 14
        noise: 0.55
        shares:
          Kind: { Field: 0.22, Elite: 0.40, Boss: 0.38 }
          Guild:
            "Gilded Fang": 0.16
            Stormcallers: 0.14
            Ironpact: 0.13
            Nightwardens: 0.11
            Emberwatch: 0.10
            Wyrmbane: 0.09
            Thornguard: 0.08
            "Silver Compass": 0.07
            "Hollow Crown": 0.07
            Oathkeepers: 0.05

  # ── Guild contracts: bounty scales with danger, and rank gates the good work. ──
  Quests:
    grain: [Date, Adventurer, Quest]
    sparsity: 0.94
    measures:
      BountyGold:
        total: 18000000
        min: 50
        max: 9000
        noise: 0.30
        trend: { yoy: 0.09 }
        shares:
          Danger: { Low: 0.12, Medium: 0.28, High: 0.36, Extreme: 0.24 }
          Quest:  pareto
          Rank:   { Gold: 0.40, Silver: 0.30, Bronze: 0.20, Copper: 0.10 }
          MonthName: seasonal
      QuestsCompleted:
        derived: "np.maximum(1, np.round(BountyGold / bounty_per_quest))"
        bounty_per_quest: { min: 220, max: 1400 }
      DaysOnQuest:
        derived: "np.maximum(1, np.round(QuestsCompleted * days_each))"
        days_each: { min: 1, max: 9 }

  # ── The loot economy: what fell off which monster. Links combat to the exchange. ──
  LootDrops:
    grain: [Date, Monster, Item]
    sparsity: 0.97
    measures:
      DropCount:
        total: 900000
        min: 1
        max: 45
        noise: 0.45
        trend: { yoy: 0.10 }
        shares:
          Rarity: { Common: 0.55, Uncommon: 0.25, Rare: 0.13, Epic: 0.055, Legendary: 0.015 }
          Item:   pareto
          Kind:   { Field: 0.60, Elite: 0.28, Boss: 0.12 }
          Monster: pareto
      LootGoldValue:
        derived: "np.round(DropCount * unit_value)"
        unit_value: { min: 5, max: 260 }

  # ── The grand exchange: goods moving through the realms' trading posts. ──
  MarketTrades:
    grain: [Date, Item, Realm]
    sparsity: 0.45
    measures:
      GoldVolume:
        total: 40000000
        min: 10
        max: 30000
        noise: 0.35
        trend: { yoy: 0.15 }
        shares:
          Category: { Weapon: 0.28, Armour: 0.24, Potion: 0.20, Reagent: 0.16, Trophy: 0.12 }
          Item:     pareto
          Realm:
            Saltreach: 0.18
            Gloamspire: 0.15
            Thornveil: 0.14
            Emberwaste: 0.13
            Hollowmere: 0.12
            Frosthollow: 0.11
            "Verdant Deep": 0.09
            "Ashfall Reach": 0.08
          MonthName: seasonal
      QuantityTraded:
        derived: "np.maximum(1, np.round(GoldVolume / unit_price))"
        unit_price: { min: 12, max: 900 }
      AvgUnitPrice:
        derived: "np.round(GoldVolume / np.maximum(1, QuantityTraded))"
